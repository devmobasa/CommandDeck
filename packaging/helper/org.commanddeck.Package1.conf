<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the helper name. -->
  <policy user="root">
    <allow own="org.commanddeck.Package1"/>
  </policy>

  <!-- Everyone else may only call the helper. Polkit decides every change. -->
  <policy context="default">
    <deny own="org.commanddeck.Package1"/>
    <deny send_destination="org.commanddeck.Package1"/>
    <allow send_destination="org.commanddeck.Package1"
           send_interface="org.commanddeck.Package1"/>
    <allow send_destination="org.commanddeck.Package1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.commanddeck.Package1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
